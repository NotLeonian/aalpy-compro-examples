name: CI
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install 3.13
          uv sync --locked
      - name: Ruff format
        run: uv run --locked ruff format --check . .github/scripts/check_uv_lock_revision.py
      - name: Ruff lint
        run: uv run --locked ruff check . .github/scripts/check_uv_lock_revision.py
      - name: Unit tests
        run: uv run --locked python -m unittest discover -s aalpy-compro/tests
      - name: Pyright
        run: uv run --locked pyright . .github/scripts/check_uv_lock_revision.py
      - name: Mypy (libraries and CI scripts)
        run: uv run --locked mypy ./aalpy-compro .github/scripts/check_uv_lock_revision.py
      - name: Mypy (examples)
        shell: bash
        run: |
          for dir in examples/*/; do
            if [ -n "$(find "$dir" -type f -name '*.py' -print -quit)" ]; then
              echo "Checking $dir"
              uv run --locked mypy "$dir"
            fi
          done
      - name: Check uv.lock revision
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: uv run --locked python .github/scripts/check_uv_lock_revision.py
