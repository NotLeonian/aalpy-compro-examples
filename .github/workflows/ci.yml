name: Python checks
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install 3.13
          uv sync --locked
      - name: Ruff format
        run: uv run --locked ruff format --check .
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: Pyright
        run: uv run --locked pyright
      - name: Mypy (library)
        run: uv run --locked mypy ./aalpy-compro
      - name: Mypy (examples)
        shell: bash
        run: |
          for dir in examples/*/; do
            if [ -n "$(find "$dir" -type f -name '*.py' -print -quit)" ]; then
              echo "Checking $dir"
              uv run --locked mypy "$dir"
            fi
          done
