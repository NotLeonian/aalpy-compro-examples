[project]
name = "aalpy-compro-examples"
version = "0.6.5"
description = "Examples of solving competitive programming problems with automata learning using AALpy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aalpy-compro",
]

[dependency-groups]
dev = [
    "hatch>=1.16.5",
    "mypy>=1.19.1",
    "pyright>=1.1.408",
    "ruff>=0.15.6",
    "uv>=0.11.25",
]

[tool.mypy]
exclude = ["ac-library"]
python_version = "3.11"

[tool.pyright]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
    "ac-library",
]
pythonVersion = "3.11"
stubPath = "aalpy-compro/typings"

[tool.ruff]
extend-exclude = ["ac-library"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
extend-select = ["I"]

[tool.uv]
required-version = ">=0.11.25"
preview-features = ["centralized-project-envs"]

[tool.uv.workspace]
members = [
    "aalpy-compro",
]

[tool.uv.sources]
aalpy-compro = { workspace = true }

[[tool.mypy.overrides]]
module = [
    "aalpy.*",
    "pydot.*",
]
ignore_missing_imports = true
